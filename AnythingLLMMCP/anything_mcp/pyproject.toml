[project]
name = "mcp-anythingllm"
version = "0.2.0"
description = "AnythingLLM MCP 桥接：工作区列表、文档问答、上传向量化、向量检索"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.scripts]
mcp-anythingllm = "mcp_anythingllm.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
